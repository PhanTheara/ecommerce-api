networks:
  sb13-net:
    external: true
volumes:
  sb13-vol:
  keycloak-sb13-vol:
services:
  keycloak-sb13:
    image: quay.io/keycloak/keycloak:26.6.4
    container_name: keycloak-sb13
    ports:
      - "1301:8080"
    command: start # start keycloak server in production
    environment:
      # Database Configuration
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres-sb13:5432/keycloak_db
      KC_DB_USERNAME: sb13usr
      KC_DB_PASSWORD: qwerqwer
      # Admin User (បណ្ដោះអាសន្ន)
      KC_BOOTSTRAP_ADMIN_USERNAME: temp_admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: temp_qwerqwer
      # Production Setting
      KC_HOSTNAME: localhost
      KC_HOSTNAME_PORT: 1301
      KC_HOSTNAME_URL: http://localhost:1301
      KC_HOSTNAME_ADMIN_URL: http://localhost:1301
      KC_HOSTNAME_STRICT: false               # set to true if HTTPS
      KC_HOSTNAME_STRICT_HTTPS: false         # set to true if HTTPS
      KC_PROXY: edge
      KC_HTTP_ENABLED: true
      #KC_HTTPS_PORT: 443
      KC_PROXY_HEADERS: xforwarded
      KC_CACHE: ispn
      KC_LOG_LEVEL: INFO
      KC_METRICS_ENABLED: true
      KC_HEALTH_ENABLED: true
      JAVA_OPTS_APPEND: "-Xms512m -Xmx2048m"
    volumes:
      - keycloak-sb13-vol:/opt/keycloak/data
      - ./keycloak/themes:/opt/keycloak/themes
      - ./keycloak/conf:/opt/keycloak/conf
    networks:
      - sb13-net
    depends_on:
      - postgres-sb13
  postgres-sb13:
    image: postgres:18.4
    container_name: postgres-sb13
    ports:
      - "1300:5432"
    environment:
      POSTGRES_PASSWORD: qwerqwer #(required)
      POSTGRES_USER: sb13usr
    volumes:
      - sb13-vol:/var/lib/postgresql/18/docker
      - ./init_db/:/docker-entrypoint-initdb.d
    networks:
      - sb13-net
